spring:
  sql:
    init:
      mode: never
  datasource:
    url: jdbc:h2:mem:archive_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
